<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atlas Project — Get Paid to Record Everyday Tasks</title>
<meta name="description" content="Record first-person videos of everyday household tasks with your iPhone and earn ₹250 for every QC-approved hour. Eligibility, rules, rejection reasons and app setup." />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("atlas_theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
  })();
</script>
</head>
<body>

<nav class="nav">
  <div class="shell nav__in">
    <a class="brand" href="#top" aria-label="Atlas Project">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="2.4"/><path d="M3 16h26M16 3c4 4 5.5 8.5 5.5 13S20 25 16 29M16 3c-4 4-5.5 8.5-5.5 13S12 25 16 29" stroke="currentColor" stroke-width="2"/></svg>
      </span>
      <span class="brand__name">Atlas</span>
    </a>
    <div class="nav__tools">
      <div class="seg" id="lang-seg" role="group" aria-label="Language"></div>
      <button type="button" class="iconbtn" id="theme-btn" onclick="toggleTheme()" aria-label="Switch theme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main id="top">

  <!-- ================= HERO ================= -->
  <header class="hero">
    <div class="hero__aura"></div>
    <div class="shell hero__in">
      <div class="rv">
        <span class="eyebrow" data-i18n="heroEyebrow"></span>
        <h1 data-i18n="heroTitle"></h1>
        <p class="lede" data-i18n="heroLede"></p>
        <div class="hero__cta">
          <span class="js-join"></span>
          <a class="btn btn--ghost btn--lg" href="#eligibility" data-i18n="heroCta2"></a>
        </div>
      </div>
      <aside class="glance card card--edge rv" aria-labelledby="glance-t">
        <h2 id="glance-t" data-i18n="glanceTitle"></h2>
        <dl id="glance"></dl>
      </aside>
    </div>
  </header>

  <!-- ================= ABOUT ================= -->
  <section class="sec sec--tint" id="about">
    <div class="shell">
      <div class="head rv">
        <h2 data-i18n="aboutTitle"></h2>
        <p data-i18n="aboutBody"></p>
      </div>
      <ul class="tags rv" id="about-tags"></ul>
    </div>
  </section>

  <!-- ================= ELIGIBILITY ================= -->
  <section class="sec" id="eligibility">
    <div class="shell">
      <div class="head rv">
        <h2 data-i18n="eligTitle"></h2>
        <p data-i18n="eligBody"></p>
      </div>
      <ol class="elig" id="elig"></ol>
    </div>
  </section>

  <!-- ================= DO / DON'T ================= -->
  <section class="sec sec--tint" id="rules">
    <div class="shell">
      <div class="head rv">
        <h2 data-i18n="ddTitle"></h2>
        <p data-i18n="ddBody"></p>
      </div>
      <div class="dd">
        <div class="dd__col dd--good card card--edge card--spot rv">
          <h3 data-i18n="doTitle"></h3>
          <ul id="do-list"></ul>
        </div>
        <div class="dd__col dd--bad card card--spot rv">
          <h3 data-i18n="dontTitle"></h3>
          <ul id="dont-list"></ul>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= REJECTION / FLAGGING ================= -->
  <section class="sec" id="reasons">
    <div class="shell">
      <div class="head rv">
        <h2 data-i18n="rejTitle"></h2>
        <p data-i18n="rejBody"></p>
      </div>
      <div class="reasons">
        <div class="rlist rlist--p0 card rv" id="p0"></div>
        <div class="rlist rlist--p1 card rv" id="p1"></div>
      </div>
    </div>
  </section>

  <!-- ================= QC & PAYMENT ================= -->
  <section class="sec sec--tint" id="pay">
    <div class="shell pay">
      <div class="rv">
        <h2 data-i18n="payTitle"></h2>
        <p class="lede" style="margin-top:16px" data-i18n="payBody"></p>
      </div>
      <div class="pay__card card card--edge card--spot rv">
        <div class="pay__rate"><b data-i18n="payRate"></b><span data-i18n="payRateL"></span></div>
        <ul class="pay__points" id="pay-points"></ul>
      </div>
    </div>
  </section>

  <!-- ================= APP ================= -->
  <section class="sec" id="app">
    <div class="shell app">
      <div class="rv">
        <div class="head">
          <h2 data-i18n="appTitle"></h2>
          <p data-i18n="appBody"></p>
        </div>
        <div id="app-steps"></div>
      </div>
      <figure class="phone rv">
        <div class="phone__frame">
          <video id="login-video" controls playsinline preload="metadata"></video>
        </div>
        <figcaption class="vid__cap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span data-i18n="appVideoCap"></span>
        </figcaption>
      </figure>
    </div>
  </section>

  <!-- ================= QUIZ ================= -->
  <section class="sec sec--tint">
    <div class="shell">
      <div class="head rv">
        <h2 data-i18n="quizTitle"></h2>
        <p data-i18n="quizBody"></p>
      </div>
      <div class="meter rv">
        <span id="q-count">0/5</span>
        <span data-i18n="quizProgress"></span>
        <span class="track"><span class="fill" id="q-fill"></span></span>
      </div>
      <div class="quiz" id="quiz"></div>
    </div>
  </section>

  <!-- ================= FAQ ================= -->
  <section class="sec" id="faq">
    <div class="shell">
      <div class="head head--center rv">
        <h2 data-i18n="faqTitle"></h2>
      </div>
      <div class="faq" id="faq-list"></div>
    </div>
  </section>

  <!-- ================= FINAL CTA ================= -->
  <section class="sec sec--tint">
    <div class="shell">
      <div class="final rv">
        <h2 data-i18n="ctaTitle"></h2>
        <p data-i18n="ctaBody"></p>
        <div class="hero__cta"><span class="js-join"></span></div>
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="shell foot__in">
    <div>
      <a class="brand" href="#top"><span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="2.4"/><path d="M3 16h26M16 3c4 4 5.5 8.5 5.5 13S20 25 16 29M16 3c-4 4-5.5 8.5-5.5 13S12 25 16 29" stroke="currentColor" stroke-width="2"/></svg></span><span class="brand__name">Atlas</span></a>
      <p class="foot__tag" data-i18n="footTag"></p>
    </div>
    <ul class="foot__links">
      <li><a href="#about" data-i18n="fAbout"></a></li>
      <li><a href="#eligibility" data-i18n="fEligibility"></a></li>
      <li><a href="#reasons" data-i18n="fRules"></a></li>
      <li><a href="#pay" data-i18n="fPay"></a></li>
      <li><a href="#app" data-i18n="fApp"></a></li>
    </ul>
  </div>
  <div class="foot__bar"><span data-i18n="footRights"></span></div>
</footer>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
