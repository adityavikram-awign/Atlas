<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Atlas Project — Awign</title>
<meta name="description" content="Record first-person videos of everyday household tasks with your iPhone and earn ₹250 for every QC-approved hour. How to start, rules, rejection reasons and payment." />
<meta name="theme-color" content="#2a5bd7" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("atlas_theme"); } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
  })();
</script>
</head>
<body>

<nav class="nav">
  <div class="shell nav__in">
    <a class="brand" href="#top" aria-label="Awign — Atlas Project">
      <img class="brand__logo" src="assets/logo.png" alt="Awign" width="97" height="24" />
      <span class="brand__tag">Atlas</span>
    </a>
    <div class="nav__tools">
      <label class="lang">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.6 5.6 3.6 9s-1.1 6.4-3.6 9M12 3C9.5 5.6 8.4 8.6 8.4 12s1.1 6.4 3.6 9"/></svg>
        <select id="lang-select" aria-label="Language"></select>
      </label>
      <button type="button" class="iconbtn" id="theme-btn" aria-label="Switch theme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main id="top">

  <!-- ================= HERO ================= -->
  <header class="hero">
    <div class="shell hero__grid">
      <div class="hero__copy">
        <span class="pill" data-i18n="heroEyebrow"></span>
        <h1 data-i18n="heroTitle"></h1>
        <p class="lede" data-i18n="heroLede"></p>
        <ul class="chips" id="chips"></ul>
        <div class="cta-row">
          <a class="btn btn--primary btn--lg" href="#start">
            <span data-i18n="heroStart"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          </a>
          <span class="js-join"></span>
        </div>
      </div>

      <aside class="rate" aria-labelledby="rate-t">
        <p class="rate__k" id="rate-t" data-i18n="rateTitle"></p>
        <div class="rate__big"><b data-i18n="payRate"></b><span data-i18n="payRateL"></span></div>
        <div class="calc">
          <div class="calc__row">
            <label for="calc-h" data-i18n="calcLabel"></label>
            <output id="calc-hv">4</output>
          </div>
          <input type="range" id="calc-h" min="1" max="5" step="1" value="4" />
          <div class="calc__ticks" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
          <div class="calc__out">
            <div><b id="calc-day"></b> <span data-i18n="calcDay"></span></div>
            <div class="calc__m"><b id="calc-30"></b> <span data-i18n="calc30"></span></div>
          </div>
        </div>
        <p class="rate__note" data-i18n="calcNote"></p>
      </aside>
    </div>
  </header>

  <!-- ================= HOW TO START ================= -->
  <section class="sec" id="start">
    <div class="shell narrow">
      <div class="head">
        <h2 data-i18n="stepsTitle"></h2>
        <p data-i18n="stepsBody"></p>
      </div>
      <div class="note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
        <div><b data-i18n="stepsNoteT"></b><p data-i18n="stepsNote"></p></div>
      </div>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <!-- ================= EXAMPLES ================= -->
  <section class="sec sec--tint" id="examples">
    <div class="shell">
      <div class="head">
        <h2 data-i18n="exTitle"></h2>
        <p data-i18n="exBody"></p>
      </div>
      <div class="work" id="work"></div>

      <div class="exgroup">
        <div class="exhead">
          <span class="tag tag--good"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg><span data-i18n="goodTag"></span></span>
          <h3 data-i18n="goodHeading"></h3>
        </div>
        <div class="clips" id="clips-good"></div>
      </div>

      <div class="exgroup">
        <div class="exhead">
          <span class="tag tag--bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span data-i18n="badTag"></span></span>
          <h3 data-i18n="badHeading"></h3>
        </div>
        <div class="clips" id="clips-bad"></div>
      </div>
    </div>
  </section>

  <!-- ================= RULES ================= -->
  <section class="sec" id="rules">
    <div class="shell">
      <div class="head">
        <h2 data-i18n="rulesTitle"></h2>
        <p data-i18n="rulesBody"></p>
      </div>

      <div class="about card">
        <h3 data-i18n="aboutTitle"></h3>
        <p data-i18n="aboutBody"></p>
      </div>

      <h3 class="sub" data-i18n="eligTitle"></h3>
      <ol class="elig" id="elig"></ol>

      <div class="dd">
        <div class="dd__col dd--good card">
          <h3><span class="dot" aria-hidden="true"></span><span data-i18n="doTitle"></span></h3>
          <ul id="do-list"></ul>
        </div>
        <div class="dd__col dd--bad card">
          <h3><span class="dot" aria-hidden="true"></span><span data-i18n="dontTitle"></span></h3>
          <ul id="dont-list"></ul>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= REJECTION / FLAGGING ================= -->
  <section class="sec" id="reasons">
    <div class="shell narrow">
      <div class="head">
        <h2 data-i18n="rejTitle"></h2>
        <p data-i18n="rejBody"></p>
      </div>
      <div class="tabs" role="tablist" id="r-tabs">
        <button type="button" role="tab" class="tab tab--p0" id="tab-p0" aria-controls="p0" aria-selected="true"></button>
        <button type="button" role="tab" class="tab tab--p1" id="tab-p1" aria-controls="p1" aria-selected="false"></button>
      </div>
      <p class="hint" data-i18n="tapHint"></p>
      <div class="rpanel rpanel--p0" role="tabpanel" id="p0" aria-labelledby="tab-p0"></div>
      <div class="rpanel rpanel--p1" role="tabpanel" id="p1" aria-labelledby="tab-p1" hidden></div>
    </div>
  </section>

  <!-- ================= QC & PAYMENT ================= -->
  <section class="sec sec--tint" id="pay">
    <div class="shell narrow">
      <div class="head">
        <h2 data-i18n="payTitle"></h2>
        <p data-i18n="payBody"></p>
      </div>
      <div class="pay card">
        <div class="pay__rate"><b data-i18n="payRate"></b><span data-i18n="payRateL"></span></div>
        <ul class="pay__points" id="pay-points"></ul>
      </div>
      <div class="tip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
        <div><b data-i18n="payTipT"></b><p data-i18n="payTip"></p></div>
      </div>
    </div>
  </section>

  <!-- ================= FAQ ================= -->
  <section class="sec" id="faq">
    <div class="shell narrow">
      <div class="head">
        <h2 data-i18n="faqTitle"></h2>
      </div>
      <div class="faq" id="faq-list"></div>
    </div>
  </section>

  <!-- ================= FINAL CTA ================= -->
  <section class="sec sec--final">
    <div class="shell narrow final">
      <h2 data-i18n="ctaTitle"></h2>
      <p data-i18n="ctaBody"></p>
      <div class="cta-row cta-row--center">
        <span class="js-join"></span>
        <a class="btn btn--ghost btn--lg" href="#start" data-i18n="heroStart"></a>
      </div>
    </div>
  </section>

</main>

<footer class="foot">
  <div class="shell">
    <div class="foot__top">
      <div class="foot__brand">
        <a class="brand" href="#top"><img class="brand__logo" src="assets/logo.png" alt="Awign" width="97" height="24" /><span class="brand__tag">Atlas</span></a>
        <p class="foot__tag" data-i18n="footTag"></p>
        <div class="foot__social" id="social"></div>
      </div>

      <div class="foot__col">
        <h4 data-i18n="footProgram"></h4>
        <ul>
          <li><a href="#start" data-i18n="fSteps"></a></li>
          <li><a href="#examples" data-i18n="fExamples"></a></li>
          <li><a href="#rules" data-i18n="fRules"></a></li>
          <li><a href="#reasons" data-i18n="fReasons"></a></li>
          <li><a href="#pay" data-i18n="fPay"></a></li>
          <li><a href="#faq" data-i18n="fFaq"></a></li>
        </ul>
      </div>

      <div class="foot__col">
        <h4 data-i18n="footCompany"></h4>
        <ul>
          <li><a id="f-awign" target="_blank" rel="noopener" data-i18n="fAwign"></a></li>
          <li><a id="f-app" target="_blank" rel="noopener" data-i18n="fAwignApp"></a></li>
          <li id="f-group-li"><a id="f-group" target="_blank" rel="noopener" data-i18n="fGroup"></a></li>
        </ul>
      </div>

      <div class="foot__col">
        <h4 data-i18n="footSupport"></h4>
        <ul>
          <li><a href="privacy.html" data-i18n="fPrivacy"></a></li>
          <li><a href="terms.html" data-i18n="fTerms"></a></li>
        </ul>
      </div>
    </div>
  </div>
  <div class="foot__bar"><span data-i18n="footRights"></span></div>
</footer>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
